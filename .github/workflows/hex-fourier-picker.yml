name: Verify optional Fourier picker against Hex
on:
  push:
    branches: [ci/hex-fourier-picker]
permissions:
  contents: read
jobs:
  picker:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      BLA_VENDOR: OpenBLAS
      OPENSSL_NO_VENDOR: '1'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Nathan-Roll1/hex
          ref: candidate/local-fourier-picker
          persist-credentials: false
      - name: Report source revision
        run: git rev-parse HEAD
      - name: Install native requirements
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends clang cmake pkg-config libasound2-dev libssl-dev libgtk-3-dev libxkbcommon-x11-dev libx11-xcb-dev libfontconfig1-dev libfreetype-dev libxcursor-dev libxi-dev libxrandr-dev libopenblas-dev libvulkan-dev glslc libshaderc-dev
      - run: cargo fmt --all --check
      - run: 'cargo test --locked --bin hex transcription::models::tests::'
