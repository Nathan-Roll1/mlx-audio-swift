name: Verify Lumen's native Fourier Windows desktop picker
on:
  push:
    branches: [ci/lumen-fourier-installed-desktop]
permissions:
  contents: read
jobs:
  picker:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Nathan-Roll1/lumen-asr
          ref: 850949c0986261b3c7c0b4f957af57c0e5d90f8f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production UI and add a same-WebView test driver
        shell: pwsh
        run: |
          cd apps/desktop
          npm ci
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          npm run build
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          @'
          (async () => {
            if(new URLSearchParams(location.search).get('window') === 'capsule') return;
            const pause = ms => new Promise(r=>setTimeout(r,ms));
            const button = (s) => Array.from(document.querySelectorAll('button')).find(b=>b.textContent.trim()===s && b.getClientRects().length);
            const report = (s) => {console.info(s); const i=new Image();i.src='http://127.0.0.1:9778/mark?line='+encodeURIComponent(s);};
            let clicked=false;
            for(let i=0;i<450;i++) {
              try {
                const close=document.querySelector('button[aria-label="关闭设置"]');
                if(close && close.getClientRects().length) close.click();
                if(!document.querySelector('nav.settings-tabs')) button('设置')?.click();
                const pick=button('下载 Oruk Fourier 2B 英语模型');
                if(!clicked && pick && !pick.disabled){report('VISIBLE and CLICKED real optional Fourier picker');pick.click();clicked=true;}
                if(clicked && (i%2===0)){
                  const s=await window.__TAURI_INTERNALS__.invoke('check_asr_model_status');
                  if(s.fourierReady && s.activeEngine==='qwen' && s.activeModelDir.includes('oruk-fourier-2b-sherpa-int8')){
                    const c=s.candidates.find(c=>c.ready && c.path===s.activeModelDir && c.engine==='qwen');
                    if(!c || s.standardQwenReady)throw Error('unexpected candidate or base-model status');
                    const input=Array.from(document.querySelectorAll('input')).some(e=>e.value===s.activeModelDir);
                    if(input){report('PASS native Windows picker and selection displayed; active='+s.activeModelDir);return;}
                  }
                }
              }catch(e){report('driver '+e)}
              await pause(1000);
            }
            report('TIMEOUT '+document.body.innerText.slice(0,700));
          })();
          '@ | Set-Content -Encoding utf8 'dist/fourier-integration-test.js'
          $p = (Resolve-Path 'dist/index.html').Path
          $html = [IO.File]::ReadAllText($p).Replace('</body>', '<script src="/fourier-integration-test.js"></script></body>')
          [IO.File]::WriteAllText($p, $html)
          cd ../..
          cargo build --locked -p lumen-asr-desktop --features custom-protocol
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
      - name: Start the instrumented desktop, then verify its native model files and saved configuration
        shell: pwsh
        run: |
          $env:LUMEN_MODELS_DIR=Join-Path $env:RUNNER_TEMP 'lumen-clean-picker-models'
          if (Test-Path $env:LUMEN_MODELS_DIR) {throw 'Expected an empty models root'}
          $bin=(Resolve-Path 'target/debug/lumen-asr-desktop.exe').Path
          cd $env:RUNNER_TEMP
          @'
          const {spawn}=require('node:child_process'),http=require('node:http'),fs=require('node:fs'),path=require('node:path');
          let app,done=false;let sawClick=false;
          function stop(code){if(done)return;done=true;clearTimeout(timer);if(app)app.kill();server.close();process.exitCode=code}
          const server=http.createServer((req,res)=>{
            const msg=new URL(req.url,'http://127.0.0.1').searchParams.get('line')||'';
            console.log(msg);res.setHeader('Access-Control-Allow-Origin','*');res.setHeader('Access-Control-Allow-Private-Network','true');res.end('ok');
            if(msg.includes('VISIBLE and CLICKED'))sawClick=true;
            if(msg.startsWith('PASS')){
              try {
                const assert=require('node:assert/strict');assert(sawClick);
                const model=path.join(process.env.LUMEN_MODELS_DIR,'oruk-fourier-2b-sherpa-int8');
                const f=fs.readdirSync(model,{recursive:true}).map(x=>path.join(model,x)).filter(x=>fs.statSync(x).isFile());
                const bytes=f.reduce((sum,p)=>sum+fs.statSync(p).size,0);
                assert.equal(f.length,10);assert.equal(bytes,2409908809);
                const candidates=[process.env.LOCALAPPDATA,process.env.APPDATA].map(p=>path.join(p,'LumenAsr','config.toml'));
                const cfgFile=candidates.find(p=>fs.existsSync(p));
                assert(cfgFile,'saved config');const cfg=fs.readFileSync(cfgFile,'utf8');
                assert(cfg.includes('oruk-fourier-2b-sherpa-int8'));assert(cfg.includes('local_qwen'));console.log('PASS 10 file checksums accepted by downloader; bytes='+bytes+'; persisted active Fourier selection');
                stop(0);
              }catch(e){console.error(e);stop(1)}
            }else if(msg.startsWith('TIMEOUT'))stop(1);
          });
          const timer=setTimeout(()=>{ console.error('Desktop result deadline exceeded');stop(1); },510000);
          server.listen(9778,'127.0.0.1',()=>{app=spawn(process.argv[2],[],{stdio:'inherit'});app.on('error',e=>{console.error(e);stop(1)});app.on('exit',code=>{if(!done){console.error('Unexpected desktop exit '+code);stop(1)}})});
          '@ | Set-Content -Encoding utf8 .\windows-native-smoke.cjs
          node .\windows-native-smoke.cjs $bin
          exit $LASTEXITCODE
