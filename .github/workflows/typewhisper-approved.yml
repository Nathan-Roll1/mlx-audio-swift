name: Normal macOS consent and conditional signed-app insertion
on:
  push:
    branches: [qa/typewhisper-approved-permissions]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check original signed BlackHole package and CoreAudio device on the disposable Mac
        run: |
          set -euo pipefail
          curl --retry 2 -fsSL https://existential.audio/downloads/BlackHole2ch-0.7.1.pkg -o "$RUNNER_TEMP/BlackHole.pkg"
          cd "$RUNNER_TEMP"
          echo '57b540f27a3e29c37e310e01bee0fdfab76733087e47f997ef9dccf851400dcf  BlackHole.pkg' | shasum -a 256 -c
          pkgutil --check-signature BlackHole.pkg
          sudo installer -pkg BlackHole.pkg -target /
          sudo killall coreaudiod || true
          brew install switchaudio-osx
          for retry in {1..12}; do
            if SwitchAudioSource -a -t input | grep -Fx 'BlackHole 2ch'; then break; fi
            sleep 2
          done
          SwitchAudioSource -t input -s 'BlackHole 2ch'
          SwitchAudioSource -t output -s 'BlackHole 2ch'
          test "$(uname -m)" = arm64
          test "$(SwitchAudioSource -t input -c)" = 'BlackHole 2ch'
          test "$(SwitchAudioSource -t output -c)" = 'BlackHole 2ch'
          echo "AUDIO_TEST_INPUT=$(SwitchAudioSource -t input -c)"
          echo "AUDIO_TEST_OUTPUT=$(SwitchAudioSource -t output -c)"
          swift -e 'import AVFoundation;print("AUDIO_TEST_MIC_AUTH",AVCaptureDevice.authorizationStatus(for:.audio).rawValue)'
      - name: Use only ordinary TypeWhisper and macOS permission controls
        id: consent
        run: bash .fourier-typewhisper-qa/onboarding.sh
      - name: Retain permission preflight screenshots and specific UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permission-preflight
          path: |
            ${{ runner.temp }}/permission-screens
            ${{ runner.temp }}/typewhisper/xcode.log
          retention-days: 14
      - name: Use the signed TypeWhisper release to dictate into an independent AppKit field
        if: steps.consent.outputs.passed == 'true'
        run: bash .fourier-typewhisper-qa/run.sh
