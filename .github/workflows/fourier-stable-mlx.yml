name: Verify released MLX Audio with local Fourier conversion
on:
  push:
    branches: [ci/released-mlx-fourier-quantization]
permissions:
  contents: read
jobs:
  official:
    runs-on: macos-latest
    timeout-minutes: 42
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight releases
        run: |
          set -eu
          test "$(uname -m)" = arm64
          xcodebuild -version
          python -m pip install -q 'mlx==0.32.4' 'mlx-audio==0.6.7' 'transformers==5.24.0'
          python - <<'PY'
          import platform
          from importlib.metadata import version
          import mlx.core as mx
          print("APPLE_RUNTIME", platform.platform(), version('mlx-audio'),version('mlx'),version('transformers'), mx.default_device(),mx.metal.is_available())
          print("array compute check", (mx.ones(1) * 3).item())
          PY
      - name: Transform pinned original weights and run two clips offline using the released Python CLI
        run: |
          set -eu
          cd .fourier-release-qa
          curl --retry 3 -fsSL https://raw.githubusercontent.com/ggml-org/whisper.cpp/b0a11594aec50892a02cd8d129eee2dfe93a8bb8/samples/jfk.wav -o jfk.wav
          curl --retry 3 -fsSL https://raw.githubusercontent.com/brittain9/speech-kit-obsidian-plugin/5d62e514bef084d65c9e0ea590636982b084aa43/native/tests/fixtures/audio/7021-79740-0000.wav -o libri.wav
          python -u prepare.py Fourier-MLX-4bit
          for clip in jfk libri; do
            HF_HUB_OFFLINE=1 mlx_audio.stt.generate --model "$PWD/Fourier-MLX-4bit" --audio "$clip.wav" --language English --max-tokens 90 --format txt --output-path "$PWD/$clip-transcript"
          done
          python -u score.py
      - name: Build the unmodified official Swift CLI
        run: |
          set -eu
          xcodebuild -downloadComponent MetalToolchain
          git clone -q --depth=1 --branch v0.2.1 https://github.com/Neywa-Labs/mlx-audio-swift.git "$RUNNER_TEMP/released-swift"
          cd "$RUNNER_TEMP/released-swift"
          test "$(git rev-parse HEAD)" = ff174ab2e961aa7516dedecf273be54c24b6426d
          xcodebuild build -scheme mlx-audio-swift-stt -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/FourierStableBuild" MACOSX_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO > "$RUNNER_TEMP/fourier-swift-build.txt" 2>&1 || { tail -80 "$RUNNER_TEMP/fourier-swift-build.txt"; exit 1; }
      - name: Run the released Swift CLI against the same local bundle
        run: |
          set -eu
          cd .fourier-release-qa
          bin="$(find "$RUNNER_TEMP/FourierStableBuild/Build/Products" -type f -name mlx-audio-swift-stt | head -1)"
          test -x "$bin"
          for clip in jfk libri; do
            rm "$clip-transcript.txt"
            HF_HUB_OFFLINE=1 "$bin" --model "$PWD/Fourier-MLX-4bit" --audio "$PWD/$clip.wav" --language English --max-tokens 90 --format txt --output-path "$PWD/$clip-transcript"
          done
          python -u score.py
